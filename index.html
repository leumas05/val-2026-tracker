<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valresultat 2026</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #fff;
            --red-block: #e74c3c;
            --blue-block: #3498db;
            --diff: #9b59b6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
        }

        .actions {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: var(--blue-block);
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }
        
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-bottom: 20px;
        }

        .party-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .card p {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .blocks-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .block-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            flex: 1;
            min-width: 250px;
        }

        .block-card.red {
            border-top: 5px solid var(--red-block);
        }

        .block-card.blue {
            border-top: 5px solid var(--blue-block);
        }

        .block-card h3 {
            margin-top: 0;
        }

        .block-card p {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .diff-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid var(--diff);
        }
        
        .diff-card p {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 10px 0;
        }

        /* Party specific colors for headings if desired */
        .party-Socialdemokraterna { color: #E8112d; }
        .party-Moderaterna { color: #52BDEC; }
        .party-Sverigedemokraterna { color: #DDDF00; }
        .party-Vänsterpartiet { color: #DA291C; }
        .party-Centerpartiet { color: #009933; }
        .party-Kristdemokraterna { color: #000077; }
        .party-Miljöpartiet { color: #83CF39; }
        .party-Liberalerna { color: #006AB3; }

    </style>
</head>
<body>

    <h1>Valresultat 2026</h1>
    <div class="actions">
        <button id="refresh-btn">Hämta ny data</button>
    </div>
    <div id="status">Hämtar och analyserar data från SVT...</div>

    <div style="display: none;" id="content-area">
        <h2>Partiernas Röster</h2>
        <div class="party-grid" id="party-list">
            <!-- Partikort läggs till här dynamiskt -->
        </div>

        <h2>Blocken</h2>
        <div class="blocks-container">
            <div class="block-card red">
                <h3>S + V + C + MP</h3>
                <p id="left-block-votes">0</p>
                <small>röster</small>
            </div>
            <div class="block-card blue">
                <h3>M + SD + KD + L</h3>
                <p id="right-block-votes">0</p>
                <small>röster</small>
            </div>
        </div>

        <div class="diff-card">
            <h3>Skillnad</h3>
            <p id="diff-votes">0</p>
            <p style="font-size: 1.2rem; margin-top: 5px; font-weight: normal;" id="diff-text"></p>
        </div>
    </div>

    <script>
        // Eftersom SVT blockerar publika CORS-proxies (Cloudflare/Akamai) hämtar vi nu datan via vår lokala Node-server.
        const proxyUrl = '/api/svt';

        function fetchData() {
            // UI state while loading
            const btn = document.getElementById('refresh-btn');
            const statusDiv = document.getElementById('status');
            
            btn.disabled = true;
            btn.innerText = 'Hämtar...';
            statusDiv.innerText = 'Hämtar och analyserar data från SVT...';
            statusDiv.style.display = 'block';
            document.getElementById('content-area').style.display = 'none';

            fetch(proxyUrl)
                .then(response => {
                    if (response.ok) return response.text();
                    throw new Error('Kunde inte hämta data (Status: ' + response.status + ')');
                })
                .then(htmlString => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlString, 'text/html');
                    
                    const parties = {};
                    const partyElements = doc.querySelectorAll('.party-text');
                    
                    partyElements.forEach(el => {
                        const name = el.textContent.trim();
                        // Leta upp närmaste li element (som brukar omge hela raden)
                        let container = el.closest('li');
                        // Fallback om strukturen ändrats något
                        if (!container) container = el.parentElement.parentElement;
                        
                        if (container) {
                            const text = container.textContent.replace(/\s+/g, ' ');
                            // Matcha "1 008 035 röster"
                            const match = text.match(/([\d\s]+)röster/);
                            if (match) {
                                const votes = parseInt(match[1].replace(/\s/g, ''), 10);
                                parties[name] = votes;
                            }
                        }
                    });

                    renderData(parties);
                })
                .catch(error => {
                    statusDiv.innerText = 'Fel vid hämtning: ' + error.message;
                    statusDiv.style.display = 'block';
                    console.error(error);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = 'Hämta ny data';
                });
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('sv-SE').format(num);
        }

        function renderData(parties) {
            const statusDiv = document.getElementById('status');
            if (Object.keys(parties).length === 0) {
                statusDiv.innerText = 'Kunde inte hitta några röster i SVT:s data. (Strukturen kanske har ändrats).';
                return;
            }
            statusDiv.style.display = 'none';
            document.getElementById('content-area').style.display = 'block';

            // Gruppering av block
            const rightParties = ['Moderaterna', 'Sverigedemokraterna', 'Kristdemokraterna', 'Liberalerna'];
            const leftParties = ['Socialdemokraterna', 'Vänsterpartiet', 'Centerpartiet', 'Miljöpartiet'];

            let rightSum = 0;
            let leftSum = 0;

            const partyListDiv = document.getElementById('party-list');
            partyListDiv.innerHTML = ''; // Rensa tidigare data!
            
            // Sortera partierna efter antal röster fallande
            const sortedParties = Object.entries(parties).sort((a, b) => b[1] - a[1]);

            sortedParties.forEach(([name, votes]) => {
                if (rightParties.includes(name)) rightSum += votes;
                if (leftParties.includes(name)) leftSum += votes;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3 class="party-${name.replace(/ /g, '')}">${name}</h3>
                    <p>${formatNumber(votes)}</p>
                `;
                partyListDiv.appendChild(card);
            });

            // Visa blocksiffror
            document.getElementById('right-block-votes').innerText = formatNumber(rightSum);
            document.getElementById('left-block-votes').innerText = formatNumber(leftSum);

            // Beräkna skillnad
            const diff = Math.abs(rightSum - leftSum);
            document.getElementById('diff-votes').innerText = formatNumber(diff) + ' röster';
            
            let diffText = "";
            if (rightSum > leftSum) {
                diffText = 'M+SD+KD+L leder.';
            } else if (leftSum > rightSum) {
                diffText = 'S+V+C+MP leder.';
            } else {
                diffText = 'Det är helt jämnt mellan blocken.';
            }
            document.getElementById('diff-text').innerText = diffText;
        }

        // Koppla knappen
        document.getElementById('refresh-btn').addEventListener('click', fetchData);

        // Hämta initialt när sidan laddas
        fetchData();
    </script>
</body>
</html>
